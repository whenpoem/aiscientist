[project]
name = "claudescientist"
version = "0.1.0"
description = "Research-agent augmentation layer for Claude Code with SQLite memory, verification MCPs, and a cockpit UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "whenpoem" },
]
keywords = [
    "claude-code",
    "mcp",
    "research",
    "sqlite",
    "fastapi",
    "react",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.135.3",
    "fastmcp>=3.2.4",
    "pydantic>=2.13.1",
    "uvicorn[standard]>=0.44.0",
]

[project.urls]
Repository = "https://github.com/whenpoem/aiscientist"
Issues = "https://github.com/whenpoem/aiscientist/issues"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", ".claude/hooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
